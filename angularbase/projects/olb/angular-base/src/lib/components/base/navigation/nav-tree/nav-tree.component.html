<div class="nav-header">
  <mat-icon (click)="onToggle()">{{ isExpanded() ? "menu_open" : "read_more" }}</mat-icon>
  @if (isExpanded()) {
    <span class="nav-title">Menü</span>
  }
</div>

<nav class="nav-content" [class.collapsed]="!isExpanded()">
  <ul class="menu">
    <olb-nav-tree-items [nodes]="menu()" [isExpanded]="isExpanded()" [currentUrl]="currentUrl()" (toggleRequested)="toggleRequested.emit()">
    </olb-nav-tree-items>
  </ul>
</nav>

<div class="nav-footer">
  @if (isExpanded()) {
    <div class="nav-footer-version">
      <span>Version: {{ appVersion() }} </span>
      <span>AngularBase: {{ baseVersion() }}</span>
    </div>
