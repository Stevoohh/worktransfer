<table mat-table matSort [dataSource]="dataSource" class="static-table">
  @for (col of columns; track col) {
    <ng-container matColumnDef="{{ col }}">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ getColName(col) }}</th>
      <td mat-cell *matCellDef="let element">{{ getColValue(element, col) }}</td>
    </ng-container>
  }
  <tr mat-header-row *matHeaderRowDef="columns; sticky: true"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>
<mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 20, 50]" showFirstLastButtons aria-label="Seite auswählen" class="paginator"> </mat-paginator>
